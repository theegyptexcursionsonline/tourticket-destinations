name: CI — Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ─────────────────────────────────────────────
  # 1. Unit & Component tests (Jest)
  # ─────────────────────────────────────────────
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact event commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run Jest tests
        run: pnpm exec jest --ci --maxWorkers=2

  # ─────────────────────────────────────────────
  # 2. API integration tests (Supertest)
  # ─────────────────────────────────────────────
  supertest:
    name: Supertest API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact event commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed isolated CI database
        run: node scripts/seed-ci-fixtures.mjs
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/eeo_ci

      - name: Build Next.js
        run: pnpm build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/eeo_ci
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-32chars-long!!' }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Start server & run Supertest
        run: |
          pnpm start &
          SERVER_PID=$!

          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          pnpm test:api || TEST_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit ${TEST_EXIT:-0}
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/eeo_ci
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-32chars-long!!' }}
          TEST_BASE_URL: http://localhost:3000

  # ─────────────────────────────────────────────
  # 3. End-to-end tests (Playwright)
  # ─────────────────────────────────────────────
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact event commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed isolated CI database
        run: node scripts/seed-ci-fixtures.mjs
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/eeo_ci

      - name: Build Next.js
        run: pnpm build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/eeo_ci
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-32chars-long!!' }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Start server & run Playwright
        run: |
          pnpm start &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          env -u NO_COLOR PLAYWRIGHT_BASE_URL=http://localhost:3000 pnpm test:e2e || TEST_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit ${TEST_EXIT:-0}
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/eeo_ci
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-32chars-long!!' }}
          CI: true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
